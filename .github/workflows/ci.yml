name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit test suite
        run: python -m unittest discover -s tests -v

      - name: Verify benchmark projects (strict 25-point check)
        run: |
          python assets/tools/microdrama_cli.py check assets/contoh/alamat-yang-sama --strict
          python assets/tools/microdrama_cli.py check assets/contoh/unit-7 --strict

      - name: Verify SHA-256 plugin sync parity
        run: python assets/tools/microdrama_cli.py sync-plugin --check
