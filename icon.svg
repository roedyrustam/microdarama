<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111C22"/>
      <stop offset="1" stop-color="#070D10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.22" r="0.65">
      <stop offset="0" stop-color="#FFB547" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FFB547" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stripes" width="64" height="64" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="32" height="64" fill="#FFB547"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- script card -->
  <rect x="112" y="232" width="288" height="180" rx="24" fill="#000000" opacity="0.4" filter="url(#soft)"/>
  <rect x="112" y="228" width="288" height="180" rx="24" fill="#F3EEE4"/>
  <rect x="146" y="274" width="176" height="14" rx="7" fill="#23343B"/>
  <rect x="146" y="306" width="220" height="14" rx="7" fill="#23343B" opacity="0.55"/>
  <rect x="146" y="338" width="148" height="14" rx="7" fill="#E8932F"/>
  <rect x="146" y="370" width="196" height="14" rx="7" fill="#23343B" opacity="0.55"/>

  <!-- precision verification reticle -->
  <circle cx="364" cy="364" r="24" fill="#18B981"/>
  <path d="M353 364l8 8 15-16" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- lower clapboard bar -->
  <rect x="112" y="190" width="288" height="50" rx="14" fill="#10191D"/>
  <rect x="112" y="190" width="288" height="50" rx="14" fill="url(#stripes)"/>

  <!-- upper clapboard bar, open -->
  <g transform="rotate(-16 120 184)">
    <rect x="112" y="132" width="288" height="50" rx="14" fill="#10191D"/>
    <rect x="112" y="132" width="288" height="50" rx="14" fill="url(#stripes)"/>
  </g>

  <!-- hinge -->
  <circle cx="126" cy="186" r="13" fill="#F3EEE4"/>
  <circle cx="126" cy="186" r="5" fill="#10191D"/>
</svg>
